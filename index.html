<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>La Grande Italia 2027 — The Henderson Grand Tour</title>
    <meta
      name="description"
      content="Browser-based travel guide and planning dashboard for La Grande Italia 2027."
    />
    <link rel="stylesheet" href="assets/css/core.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/typography.css" />
    <link rel="stylesheet" href="assets/css/utilities.css" />
    <link
      rel="stylesheet"
      href="assets/css/themes/light.css"
      id="theme-style"
    />
    <link rel="stylesheet" href="assets/css/print.css" media="print" />
    <style>
      :root {
        --page-bg:
          radial-gradient(
            circle at top left,
            rgba(199, 156, 93, 0.16),
            transparent 26%
          ),
          radial-gradient(
            circle at top right,
            rgba(110, 139, 116, 0.12),
            transparent 24%
          ),
          var(--color-bg);
        --border: rgba(0, 0, 0, 0.08);
        --nav-bg: rgba(255, 255, 255, 0.92);
        --chip-bg: #f7f2ea;
      }
      body {
        background: var(--page-bg);
      }
      .shell {
        width: min(var(--max-width), calc(100% - 2rem));
        margin: 1rem auto 3rem;
      }
      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        padding: 1.25rem 1.35rem;
        background: var(--color-surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }
      .brand h1 {
        margin: 0.15rem 0 0.25rem;
        font-size: clamp(1.9rem, 3vw, 3rem);
      }
      .brand .subhead {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }
      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 0.9rem;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.5rem 0.8rem;
        border-radius: 999px;
        border: 1px solid #eadfcf;
        background: var(--chip-bg);
        font-size: 0.93rem;
        white-space: nowrap;
      }
      .header-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        justify-content: flex-end;
      }
      .header-actions a,
      .header-actions button,
      .button-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.72rem 1rem;
        border-radius: 999px;
        border: 1px solid #dcc9b7;
        background: #fff;
        color: var(--color-text);
        text-decoration: none;
        cursor: pointer;
        font: inherit;
      }
      .button-primary {
        background: var(--color-primary) !important;
        color: #fff !important;
        border-color: var(--color-primary) !important;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.35fr 0.65fr;
        gap: 1rem;
        margin-top: 1rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }
      .stat {
        background: var(--color-surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 1rem;
      }
      .stat .label {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.78rem;
      }
      .stat .value {
        margin-top: 0.3rem;
        font-size: 1.55rem;
        font-weight: 700;
      }
      .section {
        margin-top: 1rem;
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin: 0.25rem 0 0.7rem;
      }
      .section-title h2 {
        margin: 0;
      }
      .section-title small {
        color: var(--muted);
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.15rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
      }
      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 1rem;
        border-radius: 16px;
        border: 1px solid #eadfcf;
        background: #fff;
        color: var(--color-text);
        text-decoration: none;
        min-height: 100%;
      }
      .tile strong {
        font-size: 1.02rem;
      }
      .tile span,
      .note,
      .muted {
        color: var(--muted);
      }
      .quick-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 0.8rem;
      }
      .quick-links a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.55rem 0.8rem;
        border-radius: 999px;
        border: 1px solid #dcc9b7;
        background: #fff;
        text-decoration: none;
        color: var(--color-text);
      }
      .searchbar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 1rem;
        padding: 0.85rem;
        background: var(--color-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .searchbar input {
        flex: 1 1 260px;
        padding: 0.8rem 0.95rem;
        border-radius: 999px;
        border: 1px solid #d9c7b8;
        background: #fff;
        font: inherit;
      }
      .searchbar button {
        padding: 0.8rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--color-primary);
        background: var(--color-primary);
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
      .status-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }
      .status-box {
        padding: 1rem;
        background: var(--color-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .status-box strong {
        display: block;
        font-size: 1.35rem;
      }
      .status-box .tiny {
        display: block;
        color: var(--muted);
        margin-top: 0.2rem;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--color-surface);
      }
      th,
      td {
        padding: 0.8rem 0.7rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        text-align: left;
      }
      th {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .route-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }
      .route-actions a {
        text-decoration: none;
      }
      .map-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        border: 1px solid #dcc9b7;
        background: #fff;
        color: var(--color-text);
        text-decoration: none;
        font-size: 0.92rem;
        white-space: nowrap;
      }
      .footer {
        margin-top: 1rem;
        padding: 1rem 0.2rem 0;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .hidden {
        display: none !important;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.55rem;
        border-radius: 999px;
        background: #f6efe5;
        border: 1px solid #eadfcf;
        font-size: 0.82rem;
      }
      @media (max-width: 980px) {
        .site-header,
        .hero-grid,
        .grid.two,
        .grid.three,
        .status-grid {
          grid-template-columns: 1fr;
        }
        .site-header {
          flex-direction: column;
        }
        .header-actions {
          justify-content: flex-start;
        }
      }
      @media print {
        body {
          background: #fff;
        }
        .header-actions,
        .searchbar,
        .no-print {
          display: none !important;
        }
        .site-header,
        .card,
        .stat,
        .status-box {
          box-shadow: none !important;
        }
        a {
          color: #000;
          text-decoration: none;
        }
      }
    </style>

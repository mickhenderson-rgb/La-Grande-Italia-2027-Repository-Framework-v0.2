<!doctype html>
<html lang="en">
  <head>
    <script>
      // Works out which folder this app is actually being served from
      // (e.g. "" for the domain root, "/TOS" for a subfolder),
      // so every API call can be built relative to that instead of
      // assuming the app always lives at the domain root.
      window.API_BASE = window.location.pathname.replace(/\/[^/]*$/, "");
    </script>

      href="assets/css/themes/light.css"
      id="theme-style"
    />
    <script>
      // Apply a saved dark-mode preference before the rest of the page
      // paints, so a returning dark-mode user doesn't see a flash of the
      // light theme. app/theme.js (loaded later) owns the toggle itself.
      (function () {
        try {
          if (localStorage.getItem("compass-theme") === "dark") {
            document.getElementById("theme-style").setAttribute("href", "assets/css/themes/dark.css");
          }
        } catch (error) {
          // Private browsing / storage disabled - just stays on the default light theme.
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/css/print.css" media="print" />
    <style>
      :root {
        --page-bg:
          radial-gradient(
            circle at top left,
            rgba(199, 156, 93, 0.16),
            transparent 26%
          ),
          radial-gradient(
            circle at top right,
            rgba(110, 139, 116, 0.12),
            transparent 24%
          ),
          var(--color-bg);
        --border: rgba(0, 0, 0, 0.08);
        --nav-bg: rgba(255, 255, 255, 0.92);
        --chip-bg: #f7f2ea;
      }
      body {
        background: var(--page-bg);
      }
      .shell {
        width: min(var(--max-width), calc(100% - 2rem));
        margin: 1rem auto 3rem;
      }
      .site-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        padding: 1.25rem 1.35rem;
        background: var(--color-surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }
      .brand h1 {
        margin: 0.15rem 0 0.25rem;
        font-size: clamp(1.9rem, 3vw, 3rem);
      }
      .brand .subhead {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }
      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 0.9rem;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.5rem 0.8rem;
        border-radius: 999px;
        border: 1px solid #eadfcf;
        background: var(--chip-bg);
        font-size: 0.93rem;
        white-space: nowrap;
      }
      .header-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        justify-content: flex-end;
      }
      .header-actions a,
      .header-actions button,
      .button-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        padding: 0.72rem 1rem;
        border-radius: 999px;
        border: 1px solid #dcc9b7;
        background: var(--color-surface);
        color: var(--color-text);
        text-decoration: none;
        cursor: pointer;
        font: inherit;
      }
      .button-primary {
        background: var(--color-primary) !important;
        color: #fff !important;
        border-color: var(--color-primary) !important;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.35fr 0.65fr;
        gap: 1rem;
        margin-top: 1rem;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }
      .stat {
        background: var(--color-surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 1rem;
      }
      .stat .label {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.78rem;
      }
      .stat .value {
        margin-top: 0.3rem;
        font-size: 1.55rem;
        font-weight: 700;
      }
      .section {
        margin-top: 1rem;
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 1rem;
        margin: 0.25rem 0 0.7rem;
      }
      .section-title h2 {
        margin: 0;
      }
      .section-title small {
        color: var(--muted);
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.15rem;
      }
      .grid {
        display: grid;
        gap: 1rem;
      }
      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .tile {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        padding: 1rem;
        border-radius: 16px;
        border: 1px solid #eadfcf;
        background: var(--color-surface);
        color: var(--color-text);
        text-decoration: none;
        min-height: 100%;
      }
      .tile strong {
        font-size: 1.02rem;
      }
      .tile span,
      .note,
      .muted {
        color: var(--muted);
      }
      .quick-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 0.8rem;
      }
      .quick-links a {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.55rem 0.8rem;
        border-radius: 999px;
        border: 1px solid #dcc9b7;
        background: var(--color-surface);
        text-decoration: none;
        color: var(--color-text);
      }
      .searchbar {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 1rem;
        padding: 0.85rem;
        background: var(--color-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .searchbar input {
        flex: 1 1 260px;
        padding: 0.8rem 0.95rem;
        border-radius: 999px;
        border: 1px solid #d9c7b8;
        background: var(--color-surface);
        color: var(--color-text);
        font: inherit;
      }
      .searchbar button {
        padding: 0.8rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--color-primary);
        background: var(--color-primary);
        color: #fff;
        cursor: pointer;
        font: inherit;
      }
      .status-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }
      .status-box {
        padding: 1rem;
        background: var(--color-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .status-box strong {
        display: block;
        font-size: 1.35rem;
      }
      .status-box .tiny {
        display: block;
        color: var(--muted);
        margin-top: 0.2rem;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--color-surface);
      }
      th,
      td {
        padding: 0.8rem 0.7rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        text-align: left;
      }
      th {
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .route-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }
      .route-actions a {
        text-decoration: none;
      }
      .map-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        border: 1px solid #dcc9b7;
        background: var(--color-surface);
        color: var(--color-text);
        text-decoration: none;
        font-size: 0.92rem;
        white-space: nowrap;
      }
      .footer {
        margin-top: 1rem;
        padding: 1rem 0.2rem 0;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .hidden {
        display: none !important;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.55rem;
        border-radius: 999px;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        color: var(--color-text);
        font-size: 0.82rem;
      }
      .badge-selected {
        background: var(--status-selected-bg);
        border-color: #efcb93;
        color: var(--status-selected);
      }
      .badge-booked {
        background: var(--status-booked-bg);
        border-color: #bfe0c4;
        color: var(--status-booked);
      }
      @media (max-width: 980px) {
        .site-header,
        .hero-grid,
        .grid.two,
        .grid.three,
        .status-grid {
          grid-template-columns: 1fr;
        }
        .site-header {
          flex-direction: column;
        }
        .header-actions {
          justify-content: flex-start;
        }
      }
      @media print {
        body {
          background: #fff;
        }
        .header-actions,
        .searchbar,
        .no-print {
          display: none !important;
        }
        .site-header,
        .card,
        .stat,
        .status-box {
          box-shadow: none !important;
        }
        a {
          color: #000;
          text-decoration: none;
        }
      }
    </style>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register(`${window.API_BASE}/service-worker.js`, { scope: `${window.API_BASE}/` || "/" })
            .catch((error) => {
            console.warn("Service worker registration failed:", error);
          });
        });

        // When a NEW service worker takes over this page (a deploy just
        // activated: skipWaiting + clients.claim in service-worker.js),
        // the page is still built from the OLD version's files - reload
        // once so the user actually gets the update instead of a stale
        // (or worse, mixed-version) page until they think to refresh.
        // hadController distinguishes a real update from the very first
        // visit (clients.claim also fires controllerchange when there was
        // no worker at all - reloading there would be pointless); the
        // one-shot flag guards against any reload loop.
        const hadController = !!navigator.serviceWorker.controller;

        let reloadedForNewWorker = false;

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController || reloadedForNewWorker) {
            return;
          }

          reloadedForNewWorker = true;

          window.location.reload();
        });
      }
    </script>
